name: Migrate Base Image

# 一次性 workflow：把 qicfan/qms-build-base 镜像复制到 wabisabi926 命名空间
# 使用 docker buildx imagetools 直接复制多架构 manifest，无需本地构建
# 执行完后应删除本文件

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 复制 latest tag（多架构）
        run: docker buildx imagetools create --tag ${{ secrets.DOCKER_USERNAME }}/qms-build-base:latest qicfan/qms-build-base:latest

      - name: 复制 beta tag（多架构）
        run: docker buildx imagetools create --tag ${{ secrets.DOCKER_USERNAME }}/qms-build-base:beta qicfan/qms-build-base:beta

      - name: 验证 latest 镜像
        run: docker buildx imagetools inspect ${{ secrets.DOCKER_USERNAME }}/qms-build-base:latest

      - name: 验证 beta 镜像
        run: docker buildx imagetools inspect ${{ secrets.DOCKER_USERNAME }}/qms-build-base:beta
