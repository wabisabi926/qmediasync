name: feature-build
on:
  push:
    branches:
      - "feature/**"
    tags-ignore:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get current time
        id: time
        run: echo "::set-output name=date::$(date +'%Y-%m-%dT%H:%M:%S')"
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v4
        with:
          go-version: stable
      - name: Extract branch name
        id: branch
        run: echo "::set-output name=name::${GITHUB_REF#refs/heads/feature/}"
      - name: Build Go binary
        env:
          APP_VERSION: ${{ github.ref_name }}.${{ steps.time.outputs.date }}
          PUBLISH_DATE: $${ steps.time.outputs.date }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -ldflags="-s -w -X 'main.Version=${APP_VERSION}' -X 'main.PublishDate=${PUBLISH_DATE}' -X main.ENCRYPTION_KEY=${ENCRYPTION_KEY}" -o QMediaSync .
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Sync build-base image from upstream
        run: |
          docker pull qicfan/qms-build-base:beta
          docker tag qicfan/qms-build-base:beta ${{ secrets.DOCKER_USERNAME }}/qms-build-base:beta
          docker push ${{ secrets.DOCKER_USERNAME }}/qms-build-base:beta
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/qmediasync:${{ steps.branch.outputs.name }}
          file: Dockerfile_beta
          platforms: linux/amd64
          secrets: |
            GITHUB_TOKEN=${{ secrets.RELEASE_TOKEN }}
